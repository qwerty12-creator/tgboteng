services:
  - type: web
    name: lingo-bot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: sh scripts/start.sh
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: TZ_OFFSET
        value: "3"
      - key: DB_PATH
        value: ./data/lingo.db
      # Голосовые в облаке: ключ берётся из AI_API_KEY, endpoint — DeepSeek ASR.
      - key: STT_BASE_URL
        value: https://api.deepseek.com/v1
      # Репликация SQLite во внешнее S3-хранилище (Supabase Storage, R2, облака РФ).
      # Пока эти переменные пусты, бот работает без репликации — база внутри контейнера.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_PREFIX
        value: lingo
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        value: auto
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
